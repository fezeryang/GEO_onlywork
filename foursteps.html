<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactile Bas-Relief UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0e0e0;
            --surface: #e0e0e0;
            --extrude-light: #ffffff;
            --extrude-shadow: #bebebe;
            --accent: #222;
            --text-main: #1a1a1a;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* Noise Texture Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.04;
            pointer-events: none;
            z-index: 1000;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        main {
            min-height: 200vh;
            padding: 100px 5vw;
        }

        .header-section {
            margin-bottom: 120px;
            opacity: 0;
            transform: translateY(30px);
            animation: revealHeader 1.2s var(--ease-out-expo) forwards;
        }

        @keyframes revealHeader {
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section h1 {
            font-size: clamp(3rem, 8vw, 10rem);
            letter-spacing: -0.04em;
            line-height: 0.9;
            text-transform: uppercase;
            color: transparent;
            -webkit-text-stroke: 1px var(--text-main);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 40px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
        }

        .relief-card {
            position: relative;
            height: 500px;
            background: var(--surface);
            border-radius: 2px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            
            /* Initial State: Sunk into background */
            box-shadow: 
                inset 10px 10px 20px var(--extrude-shadow),
                inset -10px -10px 20px var(--extrude-light);
            
            transform: translateZ(-50px) translateY(100px);
            opacity: 0;
            transition: 
                transform 0.8s var(--ease-out-expo),
                box-shadow 0.6s var(--ease-out-expo),
                background 0.6s var(--ease-out-expo);
        }

        /* The Creative Entrance Sequence handled by JS adding .active */
        .relief-card.active {
            opacity: 1;
            transform: translateZ(0) translateY(0);
            box-shadow: 
                15px 15px 30px var(--extrude-shadow),
                -15px -15px 30px var(--extrude-light);
        }

        .relief-card:hover {
            transform: translateZ(30px) translateY(-10px);
            box-shadow: 
                30px 30px 60px var(--extrude-shadow),
                -30px -30px 60px var(--extrude-light);
            background: #e5e5e5;
        }

        .card-category {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #888;
            overflow: hidden;
        }

        .card-category span {
            display: inline-block;
            transform: translateY(100%);
            transition: transform 0.5s var(--ease-out-expo);
        }

        .relief-card.active .card-category span {
            transform: translateY(0);
        }

        .card-title {
            font-size: 2.5rem;
            font-weight: 800;
            line-height: 1;
            margin-top: 20px;
            pointer-events: none;
        }

        .card-visual {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 40px 0;
            position: relative;
        }

        .bas-relief-icon {
            width: 120px;
            height: 120px;
            background: var(--surface);
            border-radius: 50%;
            box-shadow: 
                8px 8px 16px var(--extrude-shadow),
                -8px -8px 16px var(--extrude-light);
            transition: all 0.6s var(--ease-out-expo);
        }

        .relief-card:hover .bas-relief-icon {
            transform: scale(1.1);
            box-shadow: 
                inset 4px 4px 8px var(--extrude-shadow),
                inset -4px -4px 8px var(--extrude-light);
        }

        .card-footer {
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .card-footer .index {
            font-size: 3rem;
            line-height: 0.8;
            opacity: 0.1;
        }

        .parallax-label {
            position: absolute;
            bottom: -60px;
            left: 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #999;
            white-space: nowrap;
            opacity: 0;
            transition: transform 0.1s linear, opacity 0.3s;
        }

        .relief-card:hover .parallax-label {
            opacity: 1;
        }

        @media (max-width: 1200px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        /* Interactive Scroll Section */
        .scroll-trigger {
            height: 100px;
            margin-top: 100px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            opacity: 0.4;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: translateY(0); }
            50% { opacity: 0.5; transform: translateY(10px); }
        }
    </style>
</head>
<body>

<main>
    <section class="header-section">
        <h1 id="main-title">Extruded<br>Visions</h1>
    </section>

    <div class="grid-container" id="cardGrid">
        <!-- Card 01 -->
        <div class="relief-card" style="transition-delay: 0.1s">
            <div class="card-category"><span>System / 01</span></div>
            <div class="card-visual">
                <div class="bas-relief-icon" style="border-radius: 12px;"></div>
            </div>
            <div class="card-title">GRID<br>LOGIC</div>
            <div class="card-footer">
                <div class="desc">Structural Integrity</div>
                <div class="index">01</div>
            </div>
            <div class="parallax-label">COORDINATE_X: 12.42</div>
        </div>

        <!-- Card 02 -->
        <div class="relief-card" style="transition-delay: 0.2s">
            <div class="card-category"><span>Motion / 02</span></div>
            <div class="card-visual">
                <div class="bas-relief-icon" style="clip-path: polygon(50% 0%, 0% 100%, 100% 100%);"></div>
            </div>
            <div class="card-title">KINETIC<br>FLOW</div>
            <div class="card-footer">
                <div class="desc">Easing Functions</div>
                <div class="index">02</div>
            </div>
            <div class="parallax-label">VELOCITY_OFFSET: 0.88s</div>
        </div>

        <!-- Card 03 -->
        <div class="relief-card" style="transition-delay: 0.3s">
            <div class="card-category"><span>Chrome / 03</span></div>
            <div class="card-visual">
                <div class="bas-relief-icon"></div>
            </div>
            <div class="card-title">LIGHT<br>BENDING</div>
            <div class="card-footer">
                <div class="desc">Refractive Surfaces</div>
                <div class="index">03</div>
            </div>
            <div class="parallax-label">LUMEN_VALUE: 450</div>
        </div>

        <!-- Card 04 -->
        <div class="relief-card" style="transition-delay: 0.4s">
            <div class="card-category"><span>Depth / 04</span></div>
            <div class="card-visual">
                <div class="bas-relief-icon" style="border-radius: 40px 0 40px 0;"></div>
            </div>
            <div class="card-title">BAS<br>RELIEF</div>
            <div class="card-footer">
                <div class="desc">Tactile Depth</div>
                <div class="index">04</div>
            </div>
            <div class="parallax-label">Z_DEPTH: 120px</div>
        </div>
    </div>

    <div class="scroll-trigger">SCROLL TO EXTRUDE DEPTH</div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const cards = document.querySelectorAll('.relief-card');
        const grid = document.getElementById('cardGrid');

        // 1. Creative Staggered Entrance using Intersection Observer
        const observerOptions = {
            threshold: 0.2
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    cards.forEach((card, index) => {
                        setTimeout(() => {
                            card.classList.add('active');
                        }, index * 150);
                    });
                }
            });
        }, observerOptions);

        observer.observe(grid);

        // 2. Dynamic Mouse Interaction (Light Tracking)
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;

            cards.forEach(card => {
                if (card.classList.contains('active')) {
                    // Slight tilt based on mouse position
                    const rect = card.getBoundingClientRect();
                    const cardX = e.clientX - rect.left - rect.width/2;
                    const cardY = e.clientY - rect.top - rect.height/2;
                    
                    if (Math.abs(cardX) < 300 && Math.abs(cardY) < 400) {
                        card.style.transform = `
                            perspective(1000px) 
                            rotateY(${cardX / 20}deg) 
                            rotateX(${-cardY / 20}deg) 
                            translateZ(10px)
                        `;
                    }
                }
            });
        });

        // 3. Scroll Interaction (Downward Depth)
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const title = document.getElementById('main-title');
            
            // Parallax title
            title.style.transform = `translateY(${scrolled * 0.3}px)`;
            title.style.opacity = `${1 - scrolled / 500}`;

            // Cards deepen on scroll
            cards.forEach((card, i) => {
                const rect = card.getBoundingClientRect();
                const viewHeight = window.innerHeight;
                
                if (rect.top < viewHeight && rect.bottom > 0) {
                    const parallaxLabel = card.querySelector('.parallax-label');
                    const move = (rect.top - viewHeight/2) * 0.1;
                    parallaxLabel.style.transform = `translateX(${move}px)`;
                }
            });
        });

        // Reset card transform on mouse leave
        cards.forEach(card => {
            card.addEventListener('mouseleave', () => {
                card.style.transform = `translateZ(0) translateY(0)`;
            });
        });
    });
</script>

</body>
</html>
